[package]
name          = "iepass-core"
version       = "0.1.0"
authors       = ["Fun Maker <funmaker95@gmail.com>"]
edition       = "2024"
resolver      = "3"
rust-version  = "1.88.0"

[features]
default = ["std"]
std = ["embedded-io/std", "dep:piccolo"]

[dependencies]
embedded-io = { workspace = true }
piccolo = { workspace = true, optional = true }
gc-arena = "0.5.3"

[dev-dependencies]
embedded-io = { workspace = true, features = ["std"] }
