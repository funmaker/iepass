[workspace]
resolver = "3"
members = [".", "iepass", "iepass-core", "iepass-calib", "iepass-emu", "iepass", "iepass-test"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[workspace.dependencies]
iepass-core = { path = "./iepass-core", default-features = false }
iepass = { path = "./iepass" }

embedded-io = "0.6.1"
embedded-hal-async = "1.0.0"
defmt = { version = "1.0.1", features = ["alloc"] }
anyhow = { version = "1.0.98", default-features = false }
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }
esp-alloc = { version = "0.8.0", features = ["defmt"] }
esp-hal = { version = "=1.0.0-rc.0", features = ["defmt", "esp32s3", "unstable"] }
esp-hal-embassy = { version = "0.9.0", features = ["defmt", "esp32s3"] }
embassy-executor = { version = "0.7.0", features = ["defmt", "task-arena-size-20480", ] }
embassy-time = { version = "0.4.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
rtt-target = { version = "0.6.1", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
nb = { version = "1.1.0" }
ringbuffer = { version = "0.16.0", default-features = false }
pin-project = "1.1.10"
static_cell = "2.1.1"
piccolo = "0.3.3"

[patch.crates-io]
esp-hal = { path = "../esp-hal/esp-hal" }
esp-hal-procmacros = { path = "../esp-hal/esp-hal-procmacros" }
esp-hal-embassy = { path = "../esp-hal/esp-hal-embassy" }
esp-rom-sys = { path = "../esp-hal/esp-rom-sys" }
esp-config = { path = "../esp-hal/esp-config" }
esp-metadata = { path = "../esp-hal/esp-metadata" }
esp-metadata-generated = { path = "../esp-hal/esp-metadata-generated" }
esp-riscv-rt = { path = "../esp-hal/esp-riscv-rt" }
xtensa-lx = { path = "../esp-hal/xtensa-lx" }
xtensa-lx-rt = { path = "../esp-hal/xtensa-lx-rt" }
xtensa-lx-rt-proc-macros = { path = "../esp-hal/xtensa-lx-rt-proc-macros" }
